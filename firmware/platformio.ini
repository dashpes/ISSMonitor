; ISS Monitor firmware
; Two environments:
;   esp32dev - the real board. Needs a USB-C DATA cable.
;   native   - builds lib/orbit on your Mac and runs the unit tests.
;              No hardware needed. This is where the orbital math gets proven.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework  = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    ; ---- Hardware you have not wired yet ----
    ; Flip these to 1 as the parts arrive. With them at 0 the firmware still
    ; builds and runs; the missing input is replaced by a serial command
    ; (see io/console.h). Compiling out absent hardware instead of letting it
    ; read floating garbage is the habit worth building here.
    -DHAVE_ENCODER=0
    -DHAVE_LDR=0
    -DHAVE_AUX_SWITCHES=0
    ; LovyanGFX: we configure panels by hand in include/display_config.h,
    ; so no LGFX_USE_V1 autodetect.
    -DLGFX_USE_V1

build_unflags = -std=gnu++11

lib_deps =
    ; LovyanGFX is vendored in lib/LovyanGFX (cloned from GitHub) because the
    ; PlatformIO registry download was crawling. PlatformIO picks up lib/
    ; automatically -- nothing to declare. To go back to the registry, delete
    ; lib/LovyanGFX and uncomment the next line.
    ; lovyan03/LovyanGFX @ ^1.1.16
    ; hopperpop/Sgp4 @ ^1.0.6      -- also vendored, in lib/Sgp4
    bblanchon/ArduinoJson @ ^7.0.4

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Ilib/orbit/include
test_framework = unity
; Only lib/orbit is built here. Anything that #includes <Arduino.h>
; will fail to compile in this env -- that is the point. It keeps the
; math honest and hardware-free.

; ---------------------------------------------------------------------------
; Flash this FIRST, before any of the real firmware. It proves the wiring:
; displays, switches and LED, one at a time, with everything else compiled out.
;   pio run -e smoketest -t upload -t monitor
; ---------------------------------------------------------------------------
[env:smoketest]
extends = env:esp32dev
build_src_filter = -<*> +<../hw_check/smoketest.cpp>
; Only the display library is needed here. Overriding lib_deps to empty stops
; PlatformIO fetching ArduinoJson and Sgp4 for a test that never uses them --
; lib/LovyanGFX is local and gets picked up regardless.
lib_deps =

; ---------------------------------------------------------------------------
; Compile-only check that the code behind HAVE_ENCODER / HAVE_LDR /
; HAVE_AUX_SWITCHES still builds. Those parts are in the post, so that code
; cannot be run yet -- and code that is never compiled rots quietly. This env
; is not for uploading; it exists so `pio run -e allhw` fails loudly the day
; a refactor breaks the half of io/ that nobody can test yet.
;   pio run -e allhw
; ---------------------------------------------------------------------------
[env:allhw]
extends = env:esp32dev
; build_unflags REMOVES the =0 forms from the inherited list. Appending the
; =1 forms without removing them first leaves both on the command line, and
; the compiler is right to warn about that.
build_unflags =
    ${env:esp32dev.build_unflags}
    -DHAVE_ENCODER=0
    -DHAVE_LDR=0
    -DHAVE_AUX_SWITCHES=0
build_flags =
    ${env:esp32dev.build_flags}
    -DHAVE_ENCODER=1
    -DHAVE_LDR=1
    -DHAVE_AUX_SWITCHES=1

; ---------------------------------------------------------------------------
; Step zero: LED only. Proves the toolchain, the cable, upload, the serial
; monitor and the LED circuit -- and nothing else.
;   pio run -e led -t upload -t monitor
; ---------------------------------------------------------------------------
[env:led]
extends = env:esp32dev
build_src_filter = -<*> +<../hw_check/led_only.cpp>
lib_deps =

; ---------------------------------------------------------------------------
; Watch the debounce code in src/io/inputs.cpp run on real switches.
;   pio run -e inputs -t upload -t monitor
; ---------------------------------------------------------------------------
[env:inputs]
extends = env:esp32dev
build_src_filter = -<*> +<io/inputs.cpp> +<../hw_check/inputs_check.cpp>
lib_deps =

; ---------------------------------------------------------------------------
; End-to-end data check: Wi-Fi -> NTP -> Celestrak TLE -> SGP4 -> serial.
; No displays involved. This is where you first see the real ISS.
;   pio run -e data -t upload -t monitor
; ---------------------------------------------------------------------------
[env:data]
extends = env:esp32dev
build_src_filter = -<*> +<net/> +<app/propagator.cpp> +<../hw_check/data_check.cpp>
lib_deps =
